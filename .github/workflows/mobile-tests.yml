name: Mobile Tests Only

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'src/test/java/com/phonebook/tests/mobile/**'
      - '.github/workflows/mobile-tests.yml'

jobs:
  mobile-tests:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Java JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Step 3: Grant execution rights for Gradle wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Step 4: Install Appium Server & UiAutomator2 Driver
      - name: Install Appium Server & Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2
          
          # Step 5: Start Emulator, Launch Appium, and Run Mobile Tests
          - name: Run Mobile Tests on Android Emulator
            uses: ReactiveCircus/android-emulator-runner@v2
            with:
              api-level: 29
              target: default
              arch: x86
              profile: pixel
              script: |
                nohup appium --base-path /wd/hub --log-timestamp --log-no-colors > appium.log 2>&1 &
                echo "Waiting for Appium server to start..."
                timeout 30 sh -c 'until curl -s http://127.0.0.1:4723/wd/hub/status; do sleep 2; done'
                ./gradlew test --tests "com.phonebook.tests.mobile.**" -DappiumUrl="http://127.0.0.1:4723/wd/hub" -DappPath="src/test/resources/phonebook.apk"

      # Step 6: Upload Test Reports & Appium Logs
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-mobile-test-reports
          path: |
            build/reports/tests/test/
            appium.log