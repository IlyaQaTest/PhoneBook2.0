name: PhoneBook 2.0 Automation Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  automation-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Root1234
          MYSQL_DATABASE: phonebook
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Initialize Database Schema
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
          mysql -h 127.0.0.1 -P 3306 -u root -pRoot1234 phonebook < src/main/java/com/phonebook/docker/init.sql

      - name: Run API Tests
        run: ./gradlew test --tests "com.phonebook.tests.api.**"

      - name: Run Web UI Tests
        run: ./gradlew test --tests "com.phonebook.tests.ui.**"
        env:
          HEADLESS: true

      - name: Install Appium Server & Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Run Mobile Tests on Android Emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          system-image-api-level: 29
          target: default
          arch: x86_64
          profile: pixel
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            echo "Starting Appium..."
            nohup appium --log-timestamp --log-no-colors > appium.log 2>&1 &

            echo "Waiting for Appium server..."
            timeout 60 sh -c 'until curl -s http://127.0.0.1:4723/status; do sleep 3; done'

            echo "Waiting for emulator to stabilize..."
            sleep 25

            echo "Running mobile tests..."
            ./gradlew test --tests "com.phonebook.tests.mobile.**" -DappiumUrl="http://127.0.0.1:4723/" -DappPath="src/test/resources/phonebook.apk"

      - name: Generate Allure Report
        if: always()
        run: ./gradlew allureReport --continue

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phonebook-test-results
          path: |
            build/reports/tests/test/
            build/reports/allure-report/
            appium.log
            emulator.log
