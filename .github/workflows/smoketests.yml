name: Smoke tests

on:
  push:
    branches: ["master"]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest

      - name: List files
        run: Get-ChildItem -Recurse
        shell: pwsh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create base.properties from Secret
        run: |
          mkdir -p src/test/resources/properties
          echo "${{ secrets.BASE_PROPERTIES }}" > src/test/resources/properties/base.properties
        shell: bash

      - name: Build with Gradle Wrapper
        run: ./gradlew clean processTestResources smoke_tests -Dbrowser=chrome -Dheadless=true --info

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/reports/tests/
          retention-days: 5
          if-no-files-found: warn
