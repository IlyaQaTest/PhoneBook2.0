name: PhoneBook 2.0 Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  automation-tests:
    runs-on: ubuntu-latest

    # Service container for MySQL Database
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Root1234
          MYSQL_DATABASE: phonebook
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      # Step 1: Check out repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Java JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Step 3: Grant execution rights for Gradle wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Step 4: Import database schema into MySQL container
      - name: Initialize Database Schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -pRoot1234 phonebook < src/main/java/com/phonebook/docker/init.sql

      # Step 5: Execute API & Database Tests
      - name: Run API and Database Tests
        run: ./gradlew test --tests "com.phonebook.tests.api.**" --tests "com.phonebook.mydb.tests.**"

      # Step 6: Execute Web UI Tests (Headless Chrome)
      - name: Run Web UI Tests
        run: ./gradlew test --tests "com.phonebook.tests.ui.**"
        env:
          HEADLESS: true

      # Step 7: Set up Node.js & Appium Server for Mobile Tests
      - name: Install Appium Server & UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium --log-timestamp --log-no-colors > appium.log 2>&1 &
          sleep 5

      # Step 8: Run Mobile Tests on Android Emulator
      - name: Run Mobile Tests on Android Emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          script: ./gradlew test --tests "com.phonebook.tests.mobile.**"

      # Step 9: Upload Test Reports as Artifacts
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-reports
          path: build/reports/tests/test/